name: probe48-neon

# Temporary. Measures the NEON candidates for the Q48 batch kernels on an
# arm64 runner. Remove this workflow with the probe files.

on:
  workflow_dispatch:
  push:
    branches: ["probe/**"]

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    env:
      GOEXPERIMENT: simd
      FIXED_BATCH_PATH: neon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: CPU
        run: |
          nproc
          grep -m1 -E 'model name|CPU part|Features' /proc/cpuinfo || true
          lscpu | grep -iE 'model|vendor|flags' || true
      - name: Parity
        run: go test -count=1 -run 'Batch|Probe48' -v . | grep -E '^(=== RUN|--- |ok|FAIL|PASS)'
      - name: Bench session 1
        run: go test -run '^$' -bench '^Benchmark(Batch/op=(dot16|q48mul16)|Probe48/op=mulacc)' -benchtime=300ms -count=10 . | tee s1.txt
      - name: Bench session 2
        run: go test -run '^$' -bench '^Benchmark(Batch/op=(dot16|q48mul16)|Probe48/op=mulacc)' -benchtime=300ms -count=10 . | tee s2.txt
      - name: Stability and table
        run: |
          {
            echo '## Session stability'
            echo '```'
            benchstat -filter '.unit:(ns/op)' s1.txt s2.txt
            echo '```'
            echo '## Both sessions by implementation'
            echo '```'
            cat s1.txt s2.txt > all.txt
            benchstat -filter '.unit:(ns/op)' -col /impl all.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: probe48-neon
          path: |
            s1.txt
            s2.txt
