name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The boundary oracle must pass on every architecture: amd64 and
  # arm64 via the OS matrix, 386 for the 32-bit int paths.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
        shell: bash
      - run: go vet ./...
      - run: go test ./...

  test-386:
    runs-on: ubuntu-latest
    env:
      GOARCH: "386"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
