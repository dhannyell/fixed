name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            goos: linux
            runner: ubuntu-latest
          - goarch: arm64
            goos: linux
            runner: ubuntu-24.04-arm
          - goarch: "386"
            goos: linux
            runner: ubuntu-latest
          - goarch: wasm
            goos: js
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    env:
      GOARCH: ${{ matrix.goarch }}
      GOOS: ${{ matrix.goos }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: matrix.goarch == 'amd64'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        if: matrix.goarch == 'amd64'
        run: go vet ./...
      - name: Configure Wasm runner
        if: matrix.goarch == 'wasm'
        run: echo "$(go env GOROOT)/lib/wasm" >> "$GITHUB_PATH"
      - name: Test
        run: go test ./...

  simd:
    name: simd (${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
            path: avx2
          - goarch: arm64
            runner: ubuntu-24.04-arm
            path: neon
    runs-on: ${{ matrix.runner }}
    env:
      GOEXPERIMENT: simd
      # The path test fails unless the vector kernels are the ones selected,
      # so a runner without the feature cannot pass this job on scalar code.
      FIXED_BATCH_PATH: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The archsimd API changes between Go releases. Pin the version the
          # vector kernels were written against.
          go-version: "1.27.0"
      - name: Path
        run: go test -count=1 -run 'BatchPath' -v ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Fuzz smoke
        run: |
          for target in FuzzBatchAdd16VsScalar FuzzBatchMul16VsScalar FuzzBatchQ16FromQ32VsScalar; do
            go test -run '^$' -fuzz "^${target}\$" -fuzztime 20s . || exit 1
          done
